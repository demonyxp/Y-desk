<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Y-Desk · 屏幕 2</title>
  <link rel="stylesheet" href="styles.css">
  <script src="screen.js" defer></script>
</head>
<body class="screen-window">
  <header class="screen-window-toolbar"><strong id="screen-title">远端屏幕 2</strong><label>缩放<select id="screen-scale"><option value="fit">适应窗口</option><option value="original">原始大小</option></select></label><label>本地屏幕<select id="screen-display"><option value="">移动到显示器…</option></select></label><button id="screen-swap" class="secondary">交换双屏</button><button id="screen-fullscreen" class="secondary">全屏</button><button id="screen-return" class="secondary">合并回主窗口</button></header>
  <main id="screen-content"></main>
</body>
</html>
