name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:native
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $checksum = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($checksum.Hash.ToLower())  $($_.Name)"
          } | Set-Content -Path dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Y-Desk-Windows-x64
          path: |
            dist/Y-Desk-*-win-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Y-Desk-Windows-x64
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.exe release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Y-Desk $GITHUB_REF_NAME" --notes-file docs/release-notes.md
